server_id = "mcp_cms"
display_name = "Cms"
version = "1.1.0"
domain = "cms"
sdk_version = "0.2.0"
risk_level = "high"
writes_allowed = "gated"
transports = ["stdio"]
credentials = []
governance_gates = ["mrtr_approval"]
environments = ["development", "staging", "production"]

[[tools]]
name = "list_content"
description = "List content (articles, pages, posts) filtered by status, type, or channel"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "get_content"
description = "Get full content with metadata, SEO, and media"
risk_class = "read_only"
requires_approval = false
credential_bindings = []

[[tools]]
name = "create_content"
description = "Create content (article, page, post) in draft state"
risk_class = "generated_write_draft"
requires_approval = false
credential_bindings = []

[[tools]]
name = "update_content"
description = "Update content body, title, or metadata"
risk_class = "internal_write"
requires_approval = false
credential_bindings = []

[[tools]]
name = "publish_content"
description = "Publish content — makes it live on website/blog"
risk_class = "external_write"
requires_approval = true
credential_bindings = []

[[tools]]
name = "unpublish_content"
description = "Unpublish content — takes it offline"
risk_class = "external_write"
requires_approval = true
credential_bindings = []

